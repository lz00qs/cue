name: Release

on:
  push:
    tags:
      - 'v*' # 当推送带有 v 前缀的 tag 时触发 (例如 v1.0.0)
  workflow_dispatch: # 允许手动在网页端触发

env:
  FLUTTER_VERSION: '3.47.5' # 根据您的 Dockerfile 使用的 Flutter 版本

jobs:
  docker:
    name: Build and Publish Docker to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  android:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release signing key
        env:
          CUE_ANDROID_KEYSTORE_BASE64: ${{ secrets.CUE_ANDROID_KEYSTORE_BASE64 }}
          CUE_ANDROID_STORE_PASSWORD: ${{ secrets.CUE_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CUE_ANDROID_KEYSTORE_BASE64:?Missing CUE_ANDROID_KEYSTORE_BASE64 secret}"
          : "${CUE_ANDROID_STORE_PASSWORD:?Missing CUE_ANDROID_STORE_PASSWORD secret}"
          umask 077
          printf '%s' "$CUE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cue-release.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/cue-release.p12"
            printf 'storePassword=%s\n' "$CUE_ANDROID_STORE_PASSWORD"
            printf 'keyAlias=cue-release\n'
            printf 'keyPassword=%s\n' "$CUE_ANDROID_STORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Verify Android release certificate
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          actual="$("$apksigner_path" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          expected="$(tr -d '[:space:]' < android/release-cert.sha256)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Android APK certificate does not match android/release-cert.sha256'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build iOS (No Codesign)
        # 注意: 如果没有配置证书，iOS 只能 build 并在越狱设备或模拟器上运行。
        # 如需真正发布至 App Store，需要配置证书并在命令中移除 --no-codesign。
        run: flutter build ios --release --no-codesign
        
      - name: Compress iOS Build
        run: |
          cd build/ios/iphoneos
          zip -r cue-ios.zip Runner.app
          
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: cue-ios-app
          path: build/ios/iphoneos/cue-ios.zip

  macos:
    name: Build notarized macOS DMG
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: macos-release
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CUE_MACOS_TEAM_ID: ${{ vars.CUE_MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check macOS release credentials
        env:
          CUE_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.CUE_MACOS_DEVELOPER_ID_P12_BASE64 }}
          CUE_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CUE_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          CUE_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.CUE_MACOS_NOTARY_API_KEY_BASE64 }}
          CUE_MACOS_NOTARY_KEY_ID: ${{ secrets.CUE_MACOS_NOTARY_KEY_ID }}
          CUE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CUE_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CUE_MACOS_TEAM_ID:?Missing CUE_MACOS_TEAM_ID environment variable}"
          : "${CUE_MACOS_DEVELOPER_ID_P12_BASE64:?Missing Developer ID certificate secret}"
          : "${CUE_MACOS_DEVELOPER_ID_P12_PASSWORD:?Missing certificate password secret}"
          : "${CUE_MACOS_NOTARY_API_KEY_BASE64:?Missing notary API key secret}"
          : "${CUE_MACOS_NOTARY_KEY_ID:?Missing notary key ID secret}"
          : "${CUE_MACOS_NOTARY_ISSUER_ID:?Missing notary issuer ID secret}"
          [[ "$CUE_MACOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"
          [[ "$GITHUB_REF_NAME" == v* && "$tag_version" == "$app_version" ]] || {
            echo "::error::Release tag $GITHUB_REF_NAME does not match pubspec.yaml version $app_version"
            exit 1
          }
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Archive universal macOS app
        run: |
          set -euo pipefail
          flutter build macos --release
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Cue.xcarchive" \
            CODE_SIGN_IDENTITY='-' archive

      - name: Import Developer ID certificate
        env:
          CUE_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.CUE_MACOS_DEVELOPER_ID_P12_BASE64 }}
          CUE_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CUE_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CUE_MACOS_TEAM_ID:?Missing CUE_MACOS_TEAM_ID environment variable}"
          : "${CUE_MACOS_DEVELOPER_ID_P12_BASE64:?Missing Developer ID certificate secret}"
          : "${CUE_MACOS_DEVELOPER_ID_P12_PASSWORD:?Missing certificate password secret}"
          [[ "$CUE_MACOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          umask 077
          certificate_path="$RUNNER_TEMP/cue-developer-id.p12"
          keychain_path="$RUNNER_TEMP/cue-signing.keychain-db"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$CUE_MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CUE_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | \
            awk -v team="$CUE_MACOS_TEAM_ID" \
              'index($0, "Developer ID Application:") && index($0, "(" team ")") { print $2; exit }')"
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]] || {
            echo '::error::No Developer ID Application identity for the configured team'
            exit 1
          }
          echo "CUE_MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Export Developer ID signed app
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/CueExportOptions.plist" "$CUE_MACOS_TEAM_ID" "$CUE_MACOS_CODESIGN_IDENTITY" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], 'wb') as output:
              plistlib.dump({
                  'destination': 'export',
                  'method': 'developer-id',
                  'signingCertificate': sys.argv[3],
                  'signingStyle': 'manual',
                  'teamID': sys.argv[2],
              }, output)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cue.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/CueExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/cue-macos-export"
          test -d "$RUNNER_TEMP/cue-macos-export/Cue.app"

      - name: Sign and notarize DMG
        env:
          CUE_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.CUE_MACOS_NOTARY_API_KEY_BASE64 }}
          CUE_MACOS_NOTARY_KEY_ID: ${{ secrets.CUE_MACOS_NOTARY_KEY_ID }}
          CUE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CUE_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CUE_MACOS_NOTARY_API_KEY_BASE64:?Missing notary API key secret}"
          : "${CUE_MACOS_NOTARY_KEY_ID:?Missing notary key ID secret}"
          : "${CUE_MACOS_NOTARY_ISSUER_ID:?Missing notary issuer ID secret}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]
          umask 077
          export CUE_MACOS_NOTARY_API_KEY_PATH="$RUNNER_TEMP/cue-notary-key.p8"
          trap 'rm -f "$CUE_MACOS_NOTARY_API_KEY_PATH"' EXIT
          printf '%s' "$CUE_MACOS_NOTARY_API_KEY_BASE64" | base64 -D > "$CUE_MACOS_NOTARY_API_KEY_PATH"
          scripts/package-macos-dmg.sh \
            "$RUNNER_TEMP/cue-macos-export/Cue.app" \
            "build/release/Cue-${GITHUB_REF_NAME}-macos-universal.dmg"

      - name: Upload notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: cue-macos-dmg
          path: build/release/*.dmg
          if-no-files-found: error

  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath cue-windows.zip
        
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: cue-windows-app
          path: cue-windows.zip

  release:
    name: Create GitHub Release
    needs: [docker, android, ios, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cue-android-apk/app-release.apk
            artifacts/cue-ios-app/cue-ios.zip
            artifacts/cue-macos-dmg/*.dmg
            artifacts/cue-windows-app/cue-windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
