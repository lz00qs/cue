name: Release

on:
  push:
    tags:
      - 'v*' # 当推送带有 v 前缀的 tag 时触发 (例如 v1.0.0)
  workflow_dispatch: # 允许手动在网页端触发

env:
  FLUTTER_VERSION: '3.47.5' # 根据您的 Dockerfile 使用的 Flutter 版本

jobs:
  docker:
    name: Build and Publish Docker to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  android:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release signing key
        env:
          CUE_ANDROID_KEYSTORE_BASE64: ${{ secrets.CUE_ANDROID_KEYSTORE_BASE64 }}
          CUE_ANDROID_STORE_PASSWORD: ${{ secrets.CUE_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CUE_ANDROID_KEYSTORE_BASE64:?Missing CUE_ANDROID_KEYSTORE_BASE64 secret}"
          : "${CUE_ANDROID_STORE_PASSWORD:?Missing CUE_ANDROID_STORE_PASSWORD secret}"
          umask 077
          printf '%s' "$CUE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cue-release.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/cue-release.p12"
            printf 'storePassword=%s\n' "$CUE_ANDROID_STORE_PASSWORD"
            printf 'keyAlias=cue-release\n'
            printf 'keyPassword=%s\n' "$CUE_ANDROID_STORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Verify Android release certificate
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          actual="$("$apksigner_path" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          expected="$(tr -d '[:space:]' < android/release-cert.sha256)"
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Android APK certificate does not match android/release-cert.sha256'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build iOS (No Codesign)
        # 注意: 如果没有配置证书，iOS 只能 build 并在越狱设备或模拟器上运行。
        # 如需真正发布至 App Store，需要配置证书并在命令中移除 --no-codesign。
        run: flutter build ios --release --no-codesign
        
      - name: Compress iOS Build
        run: |
          cd build/ios/iphoneos
          zip -r cue-ios.zip Runner.app
          
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: cue-ios-app
          path: build/ios/iphoneos/cue-ios.zip

  macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build macOS
        run: flutter build macos --release
        
      - name: Compress macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -r cue-macos.zip *.app
          
      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: cue-macos-app
          path: build/macos/Build/Products/Release/cue-macos.zip

  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath cue-windows.zip
        
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: cue-windows-app
          path: cue-windows.zip

  release:
    name: Create GitHub Release
    needs: [docker, android, ios, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cue-android-apk/app-release.apk
            artifacts/cue-ios-app/cue-ios.zip
            artifacts/cue-macos-app/cue-macos.zip
            artifacts/cue-windows-app/cue-windows.zip
          generate_release_notes: true
