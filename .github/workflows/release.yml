# Keep this workflow's name/path and build-number base: both channels share its run_number.
name: Release
run-name: ${{ github.ref_name }} · ${{ inputs.build_only && 'Internal build' || inputs.windows_only && 'Windows validation' || 'Release' }} · ${{ inputs.windows_only && 'windows' || inputs.platform || 'all' }}

on:
  push:
    tags:
      - 'v[0-9]*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      build_only:
        description: Build dev packages for internal testing (Artifacts only, no Release or GHCR push)
        type: boolean
        default: false
      platform:
        description: Internal build target (requires build_only; public releases use all)
        type: choice
        default: all
        options:
          - all
          - android
          - macos
          - windows
          - ios
          - docker
      windows_only:
        description: Validate only Windows without publishing (main or dev)
        type: boolean
        default: false
      publish_stable:
        description: Publish the selected matching stable tag (vX.Y.Z) with a new build number
        type: boolean
        default: false

permissions:
  contents: read

# Internal targets, public releases, and Windows validation have separate groups.
# Only superseded dev builds in the same mode and target are cancelled.
concurrency:
  group: cue-release-${{ github.ref }}-${{ inputs.build_only || false }}-${{ inputs.windows_only || false }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  prepare:
    name: Validate source and allocate build number
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.version.outputs.metadata }}
      publish: ${{ steps.version.outputs.publish }}
      channel: ${{ steps.version.outputs.channel }}
      platform: ${{ steps.version.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release
        id: version
        env:
          BUILD_ONLY: ${{ inputs.build_only || false }}
          WINDOWS_ONLY: ${{ inputs.windows_only || false }}
          PUBLISH_STABLE: ${{ inputs.publish_stable || false }}
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prepare

  test:
    name: Release tests
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and verify packages
    needs: [prepare, test]
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      metadata: ${{ needs.prepare.outputs.metadata }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
      platform: ${{ needs.prepare.outputs.platform }}

  release:
    name: Publish complete release
    needs: [prepare, test, build]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CUE_RELEASE_METADATA: ${{ needs.prepare.outputs.metadata }}
      GH_TOKEN: ${{ github.token }}
      API_DIGEST: ${{ needs.build.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
      CUE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cue-*
          path: artifacts
      - name: Verify, upload to draft, then publish
        run: python3 scripts/release.py publish

      # Moving Docker aliases are updated only after every package is published.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote channel images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repository="${REPOSITORY,,}"
          alias=latest
          if [[ "$CUE_CHANNEL" == dev ]]; then alias=dev; fi
          docker buildx imagetools create \
            --tag "ghcr.io/$repository/cue-api:$alias" \
            "ghcr.io/$repository/cue-api@$API_DIGEST"
          docker buildx imagetools create \
            --tag "ghcr.io/$repository/cue-web:$alias" \
            "ghcr.io/$repository/cue-web@$WEB_DIGEST"
      - name: Retain ten workflow-managed Dev releases
        if: ${{ needs.prepare.outputs.channel == 'dev' }}
        continue-on-error: true
        run: python3 scripts/release.py cleanup
