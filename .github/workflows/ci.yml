name: CI

on:
  push:
    # Branch pushes validate changes; Dev packaging is manually dispatched.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  release-tools:
    name: Release tooling and backup tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v
        env:
          CUE_TEST_DOCKER: '1'

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
          pub-cache: true
          # Share the Linux SDK with Android builds; precache engines before saving.
          cache-key: 'cue-flutter-v2-:os:-:channel:-:version:-:arch:'
          pub-cache-key: 'cue-pub-v1-:os:-:version:-:arch:'
      - name: Prepare shared Android engine cache
        run: flutter precache --android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  server:
    name: Server build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
