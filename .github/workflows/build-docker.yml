name: Build Docker images

on:
  workflow_call:
    inputs:
      metadata:
        type: string
        required: true
      publish:
        type: boolean
        required: true
    outputs:
      api_digest:
        value: ${{ jobs.docker.outputs.api_digest }}
      web_digest:
        value: ${{ jobs.docker.outputs.web_digest }}

permissions:
  contents: read
  packages: write

env:
  # Release downloads contain Cue packages; Docker build records are not installers.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  CUE_CHANNEL: ${{ fromJSON(inputs.metadata).channel }}
  CUE_BUILD_NUMBER: ${{ fromJSON(inputs.metadata).build_number }}
  CUE_COMMIT: ${{ fromJSON(inputs.metadata).commit }}
  CUE_IMAGE_TAG: ${{ fromJSON(inputs.metadata).image_tag }}

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-api
          tags: |
            type=raw,value=${{ env.CUE_IMAGE_TAG }}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.repo }}/cue-web
          tags: |
            type=raw,value=${{ env.CUE_IMAGE_TAG }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./server
          cache-from: type=gha,scope=cue-api-v1,version=2
          cache-to: type=gha,scope=cue-api-v1,mode=max,version=2,ignore-error=true,timeout=3m
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=cue-web-v1,version=2
          cache-to: type=gha,scope=cue-web-v1,mode=max,version=2,ignore-error=true,timeout=3m
          build-args: |
            CUE_CHANNEL=${{ env.CUE_CHANNEL }}
            CUE_COMMIT=${{ env.CUE_COMMIT }}
            CUE_BUILD_NUMBER=${{ env.CUE_BUILD_NUMBER }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
