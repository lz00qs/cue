map $uri $cue_login_limit_key {
  default "";
  ~*^/api/auth/(?:login|setup)/?$ $binary_remote_addr;
}
map $uri $cue_refresh_limit_key {
  default "";
  ~*^/api/auth/(?:refresh|logout)/?$ $binary_remote_addr;
}
limit_req_zone $cue_login_limit_key zone=cue_login:10m rate=5r/m;
limit_req_zone $cue_refresh_limit_key zone=cue_refresh:10m rate=30r/m;

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  limit_req_status 429;

  # Administrator creation is available only through the loopback HTTP entry.
  location ~* ^/api/auth/setup(?:/|$) {
    return 403;
  }

  location /api/ {
    limit_req zone=cue_login burst=4 nodelay;
    limit_req zone=cue_refresh burst=9 nodelay;
    proxy_pass http://cue-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  location = /api/sync/events {
    proxy_pass http://cue-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    # Allow several missed 15-second heartbeats before treating the SSE
    # upstream as stalled. Transport failures are retried by the client.
    proxy_read_timeout 75s;
  }

  location / {
    proxy_pass http://cue-web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
