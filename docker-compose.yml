name: cue

services:
  cue-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=${CUE_TIMEZONE:-Asia/Shanghai}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cue}
      POSTGRES_USER: ${POSTGRES_USER:-cue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cue-api:
    image: ghcr.io/lz00qs/cue/cue-api:latest
    environment:
      NODE_ENV: production
      TZ: ${CUE_TIMEZONE:-Asia/Shanghai}
      PORT: 3000
      PGHOST: cue-db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cue}
      PGUSER: ${POSTGRES_USER:-cue}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CUE_JWT_SECRET: ${CUE_JWT_SECRET:?Set CUE_JWT_SECRET in .env}
      CUE_REFRESH_SECRET: ${CUE_REFRESH_SECRET:?Set CUE_REFRESH_SECRET in .env}
      CUE_ALLOW_SETUP: ${CUE_ALLOW_SETUP:-false}
    depends_on:
      cue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cue-web:
    image: ghcr.io/lz00qs/cue/cue-web:latest
    ports:
      - "${CUE_BIND_ADDRESS:-127.0.0.1}:${CUE_WEB_PORT:-8080}:80"
    depends_on:
      cue-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cue-https:
    image: nginx:1.27-alpine
    profiles: [https]
    ports:
      - "${CUE_HTTPS_BIND_ADDRESS:-0.0.0.0}:${CUE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CUE_TLS_CERT_FILE:-./certs/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${CUE_TLS_KEY_FILE:-./certs/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      cue-web:
        condition: service_healthy
      cue-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Keep the startup check inline so release deployment files remain self-contained.
  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: always
    user: "${CUE_UID:-999}:${CUE_GID:-999}"
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=cue-db
      - POSTGRES_DB=${POSTGRES_DB:-cue}
      - POSTGRES_USER=${POSTGRES_USER:-cue}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_ON_START=TRUE # Create a recoverable backup as soon as the service starts.
      - SCHEDULE=@hourly     # 改为每小时执行一次备份
      - BACKUP_KEEP_MINS=1440 # 保留过去 24 小时的每个小时备份 (24*60=1440分钟)
      - BACKUP_KEEP_DAYS=7   # 保留过去 7 天的每日备份
      - BACKUP_KEEP_WEEKS=4  # 保留过去 4 周的每周备份
      - BACKUP_KEEP_MONTHS=3 # 保留过去 3 个月的每月备份
      - HEALTHCHECK_PORT=8080
    depends_on:
      cue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$HEALTHCHECK_PORT/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # A subshell keeps the check's umask and cleanup traps out of the scheduler.
        preflight() (
          set -eu
          umask 077
          backup_dir=/backups
          check_path=$$backup_dir
          container_uid=$$(id -u)
          container_gid=$$(id -g)
          temp_dir=

          fail() {
            printf '%s\n' \
              '[CUE] Backup directory permission check failed.' \
              "Path: $$check_path" \
              "Container UID: $$container_uid" \
              "Container GID: $$container_gid" \
              "Reason: $$1" \
              '' \
              'Please ensure the host backup directory is' \
              'writable by the configured UID/GID.' \
              '' \
              'Check:' \
              '  CUE_UID' \
              '  CUE_GID' \
              '  ./backups ownership and permissions (including NAS ACLs)' \
              '  POSIX hard-link and symbolic-link support' >&2
            exit 1
          }

          cleanup() {
            if [ -n "$$temp_dir" ]; then
              rm -f "$$temp_dir/file" "$$temp_dir/hardlink" "$$temp_dir/symlink" &&
                rmdir "$$temp_dir"
            fi
          }
          trap 'status=$$?; if ! cleanup; then printf "%s\n" "[CUE] Could not clean temporary test directory: $$temp_dir" >&2; status=1; fi; exit "$$status"' 0
          trap 'exit 1' 1 2 15

          check() {
            operation=$$1
            shift
            if detail=$$("$$@" 2>&1); then return; fi
            fail "$$operation: $$detail"
          }

          [ "$$container_uid" -ne 0 ] || fail 'CUE_UID must be a non-root numeric UID.'
          [ -d "$$backup_dir" ] || fail 'Backup path does not exist or is not a directory.'
          # Existing rotation directories may have different owners or ACLs.
          for check_path in "$$backup_dir" "$$backup_dir/last" "$$backup_dir/daily" "$$backup_dir/weekly" "$$backup_dir/monthly"; do
            if [ "$$check_path" != "$$backup_dir" ] && [ ! -e "$$check_path" ] && [ ! -L "$$check_path" ]; then continue; fi
            [ -d "$$check_path" ] || fail 'Backup path is not a directory.'
            if detail=$$(cd "$$check_path" 2>&1); then :; else fail "Cannot enter directory: $$detail"; fi
            if temp_dir=$$(mktemp -d "$$check_path/.cue-permissions.XXXXXX" 2>&1); then :; else
              detail=$$temp_dir
              temp_dir=
              fail "Cannot create temporary test directory: $$detail"
            fi
            check 'Cannot write test file' sh -c 'printf "%s\n" cue > "$$1"' sh "$$temp_dir/file"
            check 'Cannot create hard link' ln "$$temp_dir/file" "$$temp_dir/hardlink"
            check 'Cannot create symbolic link' ln -s file "$$temp_dir/symlink"
            check 'Cannot read hard link' cmp "$$temp_dir/file" "$$temp_dir/hardlink"
            check 'Cannot read symbolic link' cmp "$$temp_dir/file" "$$temp_dir/symlink"
            [ -L "$$temp_dir/symlink" ] || fail 'Filesystem did not create a symbolic link.'
            check 'Cannot delete temporary test files' rm "$$temp_dir/symlink" "$$temp_dir/hardlink" "$$temp_dir/file"
            check 'Cannot delete temporary test directory' rmdir "$$temp_dir"
            temp_dir=
          done
          printf '%s\n' "[CUE] Backup directory permission check passed: $$backup_dir (UID: $$container_uid, GID: $$container_gid)"
        )

        if preflight; then
          if [ "$${CUE_BACKUP_CHECK_ONLY:-false}" = true ]; then exit 0; fi
          exec /init.sh
        fi
        if [ "$${CUE_BACKUP_CHECK_ONLY:-false}" = true ]; then exit 1; fi

        # Keep a real permission failure visible without an exit/restart loop.
        printf '%s\n' '[CUE] Backup scheduler is blocked and will remain unhealthy. Fix directory permissions and restart db-backup.' >&2
        trap 'exit 0' 1 2 15
        while :; do
          sleep 3600 &
          wait $$! || :
        done

volumes:
  cue-postgres-data:
