name: cue

services:
  cue-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=${CUE_TIMEZONE:-Asia/Shanghai}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cue}
      POSTGRES_USER: ${POSTGRES_USER:-cue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cue-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cue-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: cue-api:1.0.0
    environment:
      NODE_ENV: production
      TZ: ${CUE_TIMEZONE:-Asia/Shanghai}
      PORT: 3000
      PGHOST: cue-db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cue}
      PGUSER: ${POSTGRES_USER:-cue}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CUE_JWT_SECRET: ${CUE_JWT_SECRET:?Set CUE_JWT_SECRET in .env}
      CUE_REFRESH_SECRET: ${CUE_REFRESH_SECRET:?Set CUE_REFRESH_SECRET in .env}
      CUE_ALLOW_SETUP: ${CUE_ALLOW_SETUP:-false}
    depends_on:
      cue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cue-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cue-web:1.0.0
    ports:
      - "${CUE_BIND_ADDRESS:-127.0.0.1}:${CUE_WEB_PORT:-8080}:80"
    depends_on:
      cue-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cue-https:
    image: nginx:1.27-alpine
    profiles: [https]
    ports:
      - "${CUE_HTTPS_BIND_ADDRESS:-0.0.0.0}:${CUE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CUE_TLS_CERT_FILE:-./certs/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${CUE_TLS_KEY_FILE:-./certs/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      cue-web:
        condition: service_healthy
      cue-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: always
    user: postgres:postgres
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=cue-db
      - POSTGRES_DB=${POSTGRES_DB:-cue}
      - POSTGRES_USER=${POSTGRES_USER:-cue}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_ON_START=TRUE # Create a recoverable backup as soon as the service starts.
      - SCHEDULE=@hourly     # 改为每小时执行一次备份
      - BACKUP_KEEP_MINS=1440 # 保留过去 24 小时的每个小时备份 (24*60=1440分钟)
      - BACKUP_KEEP_DAYS=7   # 保留过去 7 天的每日备份
      - BACKUP_KEEP_WEEKS=4  # 保留过去 4 周的每周备份
      - BACKUP_KEEP_MONTHS=3 # 保留过去 3 个月的每月备份
      - HEALTHCHECK_PORT=8080
    depends_on:
      cue-db:
        condition: service_healthy

volumes:
  cue-postgres-data:
